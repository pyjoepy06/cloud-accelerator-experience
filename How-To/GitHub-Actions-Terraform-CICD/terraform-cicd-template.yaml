name: Terraform CI/CD Pipeline (Student Template)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      action:
        description: "Select Terraform action"
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy
        default: plan

permissions:
  id-token: write
  contents: read

jobs:
  terraform-check:
    name: Terraform Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'PATH_TO_TERRAFORM'
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.action == 'plan')
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Check Terraform Version
        run: terraform version
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::YOUR_AWS_ACCOUNT_ID:role/YOUR_TERRAFORM_ROLE
          aws-region: YOUR_AWS_REGION
      - name: Verify AWS Authentication
        run: aws sts get-caller-identity
      - name: Terraform Init
        run: terraform init -input=false
      - name: Terraform Format Check
        run: terraform fmt -check
      - name: Terraform Validate
        run: terraform validate
      - name: Terraform Plan
        run: terraform plan -input=false -no-color

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
    environment: terraform-apply
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: 'PATH_TO_TERRAFORM'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::YOUR_AWS_ACCOUNT_ID:role/YOUR_TERRAFORM_ROLE
          aws-region: YOUR_AWS_REGION
      - name: Terraform Init
        run: terraform init -input=false
      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan
      - name: Terraform Apply
        run: terraform apply -input=false tfplan

  terraform-destroy:
    name: Terraform Destroy
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
    runs-on: ubuntu-latest
    environment: terraform-destroy
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: 'PATH_TO_TERRAFORM'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::YOUR_AWS_ACCOUNT_ID:role/YOUR_TERRAFORM_ROLE
          aws-region: YOUR_AWS_REGION
      - name: Terraform Init
        run: terraform init -input=false
      - name: Terraform Destroy
        run: terraform destroy -auto-approve -input=false
